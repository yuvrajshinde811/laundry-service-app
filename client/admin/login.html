<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | FreshWave Laundry</title>
  
  <!-- Fonts & Bootstrap 5.3 & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5 col-xl-4">
        
        <div class="text-center mb-4">
          <a class="brand-logo justify-content-center mb-2" href="/">
            <div class="brand-icon"><i class="bi bi-droplet-fill"></i></div>
            <span>FreshWave <span class="text-primary">Laundry</span></span>
          </a>
          <span class="badge bg-secondary-subtle text-secondary px-3 py-1 rounded-pill">Staff & Operations Access</span>
        </div>

        <div class="booking-card shadow-sm border">
          <h4 class="h5 fw-bold mb-3 text-secondary text-center">Administrator Login</h4>
          
          <!-- Error Alert -->
          <div id="login-error-alert" class="alert alert-danger py-2 px-3 small d-none mb-3"></div>

          <form id="admin-login-form">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Admin Email</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" id="login-email" class="form-control" value="admin@laundry.com" required autocomplete="username">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" id="login-password" class="form-control" value="Admin@123456" required autocomplete="current-password">
              </div>
            </div>

            <button type="submit" id="btn-login-submit" class="btn btn-primary-custom w-100 justify-content-center mt-2">
              <span id="login-spinner" class="spinner-border spinner-border-sm d-none me-2"></span>
              <span><i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard</span>
            </button>
          </form>

          <div class="p-3 bg-light rounded-3 mt-4 small border">
            <div class="fw-bold text-secondary mb-1"><i class="bi bi-info-circle me-1"></i> Default Setup Credentials:</div>
            <div>Email: <code>admin@laundry.com</code></div>
            <div>Password: <code>Admin@123456</code></div>
          </div>
        </div>

        <div class="text-center mt-4">
          <a href="/" class="text-muted small text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i> Return to Customer Website
          </a>
        </div>

      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect to dashboard
      if (localStorage.getItem('adminToken')) {
        window.location.href = '/admin/dashboard.html';
      }

      const form = document.getElementById('admin-login-form');
      const errBox = document.getElementById('login-error-alert');
      const spinner = document.getElementById('login-spinner');
      const submitBtn = document.getElementById('btn-login-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errBox.classList.add('d-none');
        spinner.classList.remove('d-none');
        submitBtn.disabled = true;

        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });

          const data = await res.json();

          if (!res.ok || !data.success) {
            throw new Error(data.message || 'Invalid email or password.');
          }

          // Save Token & User Info
          localStorage.setItem('adminToken', data.token);
          localStorage.setItem('adminName', data.admin.name);
          localStorage.setItem('adminEmail', data.admin.email);

          window.location.href = '/admin/dashboard.html';
        } catch (err) {
          errBox.textContent = err.message || 'Login failed. Please try again.';
          errBox.classList.remove('d-none');
        } finally {
          spinner.classList.add('d-none');
          submitBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
